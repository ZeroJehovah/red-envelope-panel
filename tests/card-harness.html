<!doctype html>
<!-- 红包详情窗口的 DOM 自检页（开发期用，不随扩展发布）。

     用法：把本文件连同 card.js / card.css / card-window.js / envelope.js / envelope.css /
     hb-protocol.js / browser-shim.js 复制到扩展产物目录（与 manifest.json 同级），再用 Chrome
     打开并带上红包条目 id；自检跑完把结果写进 #harness-result，标题变为 HARNESS-PASS /
     HARNESS-FAIL。

     URL 上的 view 决定卡片种类（card.js）：view=claim 是等着点一下的领取卡片，缺省或
     view=detail 是点历史行开出的详情卡片。能否领取跟着**条目状态**走（v0.13.0），待开启
     的条目即便开的是详情卡片也留着「开红包」。

       card-harness.html?id=hp1&view=claim   待开启的普通红包（领取卡片，可领）
       card-harness.html?id=hp2&view=claim   抽奖红包（领取卡片，未报名）
       card-harness.html?id=hp3              已领取完的历史红包（详情卡片）
       card-harness.html?id=hp4              已领完且自己没领到（金额显示 0.00，详情卡片）
       card-harness.html?id=hp5              后台内存里没有、要等一次只读查询（先看 loading，详情卡片）
       card-harness.html?id=hp6              待开启的普通红包点历史行开出的详情卡片（自己也留着「开红包」）
       card-harness.html?id=missing          条目不在时的兜底说明

     无头运行示例（窗口至少 424×668，卡片才铺到原尺寸 384×624）：
       chrome.exe --headless=new --disable-gpu --virtual-time-budget=8000 \
         --window-size=560,900 \
         --user-data-dir="D:\Green Files\ChromeForTestingProfiles\card-harness" \
         --dump-dom "file:///D:/Green%20Files/chrome%20plugins/red-envelope-panel/card-harness.html?id=hp1&view=claim"
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>card harness</title>
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <main id="hb-card-loading" role="status">
      <div class="hb-card-spinner" aria-hidden="true"></div>
      <p>正在读取红包详情…</p>
    </main>
    <main id="hb-card-error" hidden></main>
    <pre id="harness-result">running</pre>
    <script>
      const entryId = new URLSearchParams(location.search).get('id') || '';
      const sent = [];
      const listeners = [];
      const windowUpdates = [];
      const sessionBag = {};
      let closeCalls = 0;
      window.close = () => { closeCalls += 1; };
      // headless 里 screen 默认只有 800×600，比卡片还小，card.js 会按约定跳过「按卡片收紧」；
      // 这里把屏幕报大一点，好把那段逻辑本身也验到（改不动就按真实屏幕断言，两种结果都算过）。
      try {
        Object.defineProperty(screen, 'availWidth', { value: 1920, configurable: true });
        Object.defineProperty(screen, 'availHeight', { value: 1080, configurable: true });
      } catch {
        // 改不动就按真实屏幕断言。
      }
      // 详情窗口要的原始红包：替身按 id 回放，字段与站点返回的形状一致。
      const packetDetails = {
        hp1: {
          id: 'hp1', type: 'random', status: 'active', code: '11775521', wish: '恭喜发财，大吉大利',
          creator: { username: 'alice', linuxdo_id: 1 }, count: 5, claimed_count: 2, claimed_amount: 1.23,
          claims: [{ share_id: 7, username: 'carol', amount: 1.23, at: 2 }],
        },
        hp2: {
          id: 'hp2', type: 'lottery', status: 'active', distribution_type: 'random', code: '11775521',
          wish: '拼手气抽奖', creator: { username: 'alice', linuxdo_id: 1 }, total_amount: 20, count: 3,
          draw_at: Date.now() + 60000, server_now: Date.now(),
          participants: [{ username: 'bob', name: 'bob', linuxdo_id: 9 }], winners: [],
        },
        hp3: {
          id: 'hp3', type: 'random', status: 'exhausted', code: '11775521', wish: '恭喜发财，大吉大利',
          creator: { username: 'alice', linuxdo_id: 1 }, count: 5, claimed_count: 2, claimed_amount: 1.23,
          mine: 1.23, claims: [{ share_id: 7, username: 'carol', amount: 1.23, at: 2 }],
        },
        hp4: {
          id: 'hp4', type: 'random', status: 'exhausted', code: '80146763', wish: '恭喜发财，大吉大利',
          creator: { username: 'oftx', linuxdo_id: 447199, avatar_url: 'https://cdn.ldstatic.com/user_avatar/linux.do/oftx/288/2162182_2.png' },
          count: 11, claimed_count: 11, claimed_amount: 125, mine: null, luckiest_claim_id: 15143,
          claims: [
            { share_id: 15145, username: 'jackwyw', linuxdo_id: 435753, avatar_url: 'https://cdn.ldstatic.com/user_avatar/linux.do/jackwyw/288/2353156_2.png', amount: 0.87, at: 5 },
            { share_id: 15143, username: 'Yueby', linuxdo_id: 217875, avatar_url: 'https://cdn.ldstatic.com/user_avatar/linux.do/yueby/288/1499203_2.png', amount: 25.31, at: 4 },
          ],
        },
        hp5: {
          id: 'hp5', type: 'random', status: 'exhausted', code: '80146763', wish: '恭喜发财，大吉大利',
          creator: { username: 'alice', linuxdo_id: 1 }, count: 5, claimed_count: 2, claimed_amount: 1.23,
          mine: 1.23, claims: [{ share_id: 7, username: 'carol', amount: 1.23, at: 2 }],
        },
        hp6: {
          id: 'hp6', type: 'random', status: 'active', code: '11775521', wish: '恭喜发财，大吉大利',
          creator: { username: 'alice', linuxdo_id: 1 }, count: 5, claimed_count: 2, claimed_amount: 1.23,
          claims: [{ share_id: 7, username: 'carol', amount: 1.23, at: 2 }],
        },
      };
      const state = {
        entries: [
          {
            id: 'hp1', code: '11775521', charset: 'numeric', claimMode: 'manual', status: 'awaiting',
            result: '等待手动开启', lines: [{ text: '等待手动开启', tone: 'muted' }],
            packet: { id: 'hp1', type: 'random', status: 'active', code: '11775521', creator: { username: 'alice', linuxdo_id: 1 } },
            packetId: 'hp1', matched: true, createdAt: 1,
          },
          {
            id: 'hp2', code: '11775521', charset: 'numeric', claimMode: 'manual', status: 'awaiting',
            result: '等待手动参与抽选', lines: [{ text: '等待手动参与抽选', tone: 'muted' }],
            packet: { id: 'hp2', type: 'lottery', joined: false, code: '11775521', creator: { username: 'alice', linuxdo_id: 1 } },
            packetId: 'hp2', matched: true, createdAt: 2,
          },
          {
            id: 'hp3', code: '11775521', charset: 'numeric', claimMode: 'manual', status: 'done',
            result: '领取成功: +1.23 LDC', lines: [{ text: '领取成功: +1.23 LDC', tone: 'success' }],
            packet: { id: 'hp3', type: 'random', status: 'exhausted', code: '11775521', mine: 1.23, creator: { username: 'alice', linuxdo_id: 1 } },
            packetId: 'hp3', matched: true, createdAt: 3,
          },
          {
            id: 'hp4', code: '80146763', charset: 'numeric', claimMode: 'manual', status: 'done',
            result: '未领取: 红包已抢光', lines: [{ text: '未领取: 红包已抢光', tone: 'muted' }],
            packet: { id: 'hp4', type: 'random', status: 'exhausted', code: '80146763', mine: null, creator: { username: 'oftx', linuxdo_id: 447199 } },
            packetId: 'hp4', matched: true, createdAt: 4,
          },
          {
            id: 'hp5', code: '80146763', charset: 'numeric', claimMode: 'manual', status: 'done',
            result: '领取成功: +1.23 LDC', lines: [{ text: '领取成功: +1.23 LDC', tone: 'success' }],
            packet: { id: 'hp5', type: 'random', status: 'exhausted', code: '80146763', mine: 1.23, creator: { username: 'alice', linuxdo_id: 1 } },
            packetId: 'hp5', matched: true, createdAt: 5,
          },
          {
            // 待开启，这次是按「点历史行」的方式打开的：给的是详情卡片（能不能领跟着条目状态走）。
            id: 'hp6', code: '11775521', charset: 'numeric', claimMode: 'manual', status: 'awaiting',
            result: '等待手动开启', lines: [{ text: '等待手动开启', tone: 'muted' }],
            packet: { id: 'hp6', type: 'random', status: 'active', code: '11775521', creator: { username: 'alice', linuxdo_id: 1 } },
            packetId: 'hp6', matched: true, createdAt: 6,
          },
        ],
        settings: { charset: 'text', batch: false, claimMode: 'manual', gapExtraMs: 0, display: 'panel' },
      };
      globalThis.chrome = {
        runtime: {
          getManifest: () => ({ version: 'harness' }),
          getURL: (path) => new URL(path, location.href).href,
          sendMessage: async (message) => {
            sent.push(message);
            if (message.type === 'hb:state:get') return { ok: true, state };
            if (message.type === 'hb:packet') {
              // hp5 专门验「后台内存里没有整包快照」那条路：cache 读个空，refresh 才在延迟后回包。
              if (message.cache === true) {
                return entryId === 'hp5'
                  ? { ok: false, error: '内存里没有这个红包的快照' }
                  : { ok: true, packet: packetDetails[message.id] || null };
              }
              if (entryId === 'hp5') await new Promise((resolve) => setTimeout(resolve, 300));
              return { ok: true, packet: packetDetails[message.id] || null };
            }
            if (message.type === 'hb:session') return { ok: true, loggedIn: true, username: 'harness', linuxdo_id: 9 };
            if (message.type === 'hb:claim') {
              return {
                ok: true,
                state,
                outcome: { lines: [{ text: '领取成功: +1.23 LDC', tone: 'success' }], amount: 1.23 },
                packet: packetDetails[entryId] || null,
              };
            }
            return { ok: false, error: '未知消息：' + String(message.type) };
          },
        },
        storage: {
          onChanged: { addListener: (listener) => listeners.push(listener) },
          session: {
            get: async (key) => (key in sessionBag ? { [key]: sessionBag[key] } : {}),
            set: async (items) => { Object.assign(sessionBag, items); },
            remove: async (key) => { delete sessionBag[key]; },
          },
        },
        windows: {
          getCurrent: async () => ({ id: 7 }),
          update: async (id, props) => { windowUpdates.push({ id, ...props }); return { id }; },
        },
      };
    </script>
    <script src="browser-shim.js"></script>
    <script src="hb-protocol.js"></script>
    <script src="card-window.js"></script>
    <script src="envelope.js"></script>
    <script src="card.js"></script>
    <script>
      (async () => {
        const passed = [];
        const failed = [];
        const check = (name, ok, detail) => {
          (ok ? passed : failed).push((ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' → ' + detail : ''));
        };
        const tick = () => new Promise((resolve) => setTimeout(resolve, 0));
        const host = () => document.getElementById('hb-envelope-host');
        const card = () => host() && host().shadowRoot && host().shadowRoot.querySelector('.redpacket-envelope');
        const inCard = (selector) => (card() ? card().querySelector(selector) : null);
        const loadingBox = () => document.getElementById('hb-card-loading');
        const click = (node) => node.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        const lottery = entryId === 'hp2';
        // 卡片种类（card.js 的 view 参数）：hp1（待开启的普通红包）与 hp2（未报名的抽奖）走
        // 领取卡片，其余 id 是详情卡片（hp6 是待开启的条目，详情卡片自己也留着领取入口）。
        const viewKind = entryId === 'hp1' || entryId === 'hp2' ? 'claim' : 'detail';
        const claims = (type) => sent.filter((message) => message.type === type);
        const packetReads = () => sent.filter((message) => message.type === 'hb:packet');
        const cacheReads = () => packetReads().filter((message) => message.cache === true);
        const refreshReads = () => packetReads().filter((message) => message.refresh === true);

        try {
          for (let index = 0; index < 6; index += 1) await tick();
          // hp5 的只读查询要 300ms 才回来：趁这会儿看窗口里是不是只有一层 loading。
          if (entryId === 'hp5') {
            check('数据回来之前只显示 loading',
              Boolean(loadingBox()) && loadingBox().hidden === false,
              loadingBox() ? 'hidden=' + loadingBox().hidden : '没有 loading 层');
            check('数据回来之前不铺卡片样式', host() === null);
          }
          // 自检页是 file://，拿不到可 fetch 的同包样式，走 <link> 兜底：样式到位前卡片先藏着，
          // 400ms 后再放开。多等一会儿再断言「已经看得见」。
          await new Promise((resolve) => setTimeout(resolve, 600));

          if (entryId === 'missing') {
            const box = document.getElementById('hb-card-error');
            check('条目不在时给出兜底说明',
              box.hidden === false && /没有红包详情/.test(box.textContent), box.textContent);
            check('条目不在时不挂卡片', host() === null);
          } else {
            const record = sessionBag['hb-card-window'];
            check('窗口按卡片种类登记自己的窗口号与红包 id',
              Boolean(record) && Boolean(record[viewKind])
              && record[viewKind].windowId === 7 && record[viewKind].entryId === entryId,
              JSON.stringify(record));
            // 窗口按卡片收紧（视口至少要放得下卡片与遮罩留白）：普通 424×668，抽奖 544×812。
            // 屏幕装不下时不收紧（保持面板要的外框尺寸），这两种结果都算过。
            const want = lottery ? [544, 812] : [424, 668];
            const fit = windowUpdates[windowUpdates.length - 1];
            const fitsScreen = want[0] <= screen.availWidth && want[1] <= screen.availHeight;
            // 要的是外框尺寸 = 想要的视口 + 浏览器自己的标题栏/边框（out - in），所以只验下界，
            // 上界留出这段框架差（无头里 outer - inner 就有 87px）。
            const frameAllowance = 160;
            check('窗口按卡片尺寸收紧',
              fitsScreen
                ? Boolean(fit) && fit.id === 7
                  && fit.width >= want[0] && fit.width <= want[0] + frameAllowance
                  && fit.height >= want[1] && fit.height <= want[1] + frameAllowance
                : windowUpdates.length === 0,
              (fit ? (fit.width + '×' + fit.height) : '未收紧') + '，期望 ≥ ' + want.join('×')
              + '，屏幕 ' + screen.availWidth + '×' + screen.availHeight);
            check('卡片挂在影子宿主里', Boolean(card()));
            check('卡片样式到位后才显示',
              Boolean(host()) && host().style.visibility !== 'hidden',
              host() ? (host().style.visibility || '(可见)') : 'null');
            // 原尺寸＝原站 320×520（抽奖卡 420×640）再乘 1.2 倍缩放，窗口不够时才按视口收住。
            const box = card() ? card().getBoundingClientRect() : { width: 0, height: 0 };
            const wantW = Math.min(lottery ? 504 : 384, Math.round(window.innerWidth - 40));
            const wantH = Math.min(lottery ? 768 : 624, Math.round(window.innerHeight - 44));
            check('卡片保持原尺寸（原站尺寸乘 1.2 倍）',
              Math.abs(Math.round(box.width) - wantW) <= 1 && Math.abs(Math.round(box.height) - wantH) <= 1,
              Math.round(box.width) + '×' + Math.round(box.height) + '，期望 ' + wantW + '×' + wantH
              + ' @ ' + window.innerWidth + '×' + window.innerHeight);
            check('卡片只有一层外壳',
              Boolean(card()) && card().querySelectorAll('.redpacket-envelope').length === 0
              && Boolean(card().parentElement) && card().parentElement.classList.contains('modal-overlay'));
            check('数据到位后撤掉 loading',
              Boolean(loadingBox()) && loadingBox().hidden === true,
              loadingBox() ? 'hidden=' + loadingBox().hidden : '没有 loading 层');

            // 详情的读法：先问后台内存里的整包快照（cache 读，0 次请求），命中就直接铺卡片；
            // 命中且这张卡片还要看结论（领取记录、参与名单）才在后台补一次只读刷新。
            if (entryId === 'hp5') {
              check('内存里没有时 cache 读空后补一次只读查询',
                cacheReads().length === 1 && refreshReads().length === 1, JSON.stringify(packetReads()));
            } else {
              check('先问后台内存里的整包快照', cacheReads().length === 1, JSON.stringify(packetReads()));
              const wantRefresh = entryId === 'hp3' || entryId === 'hp4' || entryId === 'hp6' ? 1 : 0;
              check(wantRefresh ? '看过结论的卡片在后台补一次刷新' : '还在等点击的卡片不在后台多跑一趟',
                refreshReads().length === wantRefresh, JSON.stringify(packetReads()));
            }

            if (entryId === 'hp6') {
              // 点历史行开出来的详情卡片：铺的是进度与领取记录，不摆封口视图；但这个红包还等着
              // 点一下（古法），所以卡片自己留着「开红包」——关掉后台自动弹出的那张卡片之后仍能领
              // （v0.13.0 起领取入口跟着条目状态走，不跟着卡片种类走）。
              check('详情卡片不摆封口视图',
                Boolean(inCard('#envelope-closed-view')) && inCard('#envelope-closed-view').style.display === 'none',
                inCard('#envelope-closed-view') && inCard('#envelope-closed-view').style.display);
              check('待开启条目开出的详情卡片直接给出结论视图',
                Boolean(inCard('#envelope-opened-view')) && inCard('#envelope-opened-view').style.display === 'flex'
                && String((inCard('#env-opened-title') || {}).textContent || '') === '来自 alice 的红包',
                inCard('#env-opened-title') && inCard('#env-opened-title').textContent);
              check('详情卡片铺出领取进度与领取记录',
                Boolean(inCard('#env-claimed-count')) && inCard('#env-claimed-count').textContent === '2 / 5'
                && Boolean(inCard('#env-claims-list'))
                && inCard('#env-claims-list').querySelectorAll('.envelope-claim-row').length === 1,
                inCard('#env-claimed-count') && inCard('#env-claimed-count').textContent);
              check('还等着点一下的条目在详情卡片里留着「开红包」',
                Boolean(inCard('#btn-open-packet-detail')) && inCard('#btn-open-packet-detail').hidden === false
                && inCard('#btn-open-packet-detail').textContent === '开红包',
                inCard('#btn-open-packet-detail') && inCard('#btn-open-packet-detail').textContent);
              // 合成点击在 envelope.js 的 runWrite 门口就被 isTrusted 挡下，落到后台的写请求为 0。
              if (inCard('#btn-open-packet-detail')) click(inCard('#btn-open-packet-detail'));
              await tick();
              check('合成点击不授权领取（isTrusted 校验）',
                claims('hb:claim').length === 0, JSON.stringify(claims('hb:claim')));
            }

            if (entryId === 'hp1') {
              check('待开启的红包显示发件人与口令',
                inCard('#env-sender-name') && inCard('#env-sender-name').textContent === '来自 alice 的红包'
                && inCard('#env-footer-code') && inCard('#env-footer-code').textContent === '11775521',
                inCard('#env-footer-code') && inCard('#env-footer-code').textContent);
              check('头像用随包的兜底 SVG',
                String((inCard('#env-creator-avatar') || {}).src || '').startsWith('data:image/svg+xml'));
              check('给出开启按钮', Boolean(inCard('#btn-open-packet')));
              if (inCard('#btn-open-packet')) click(inCard('#btn-open-packet'));
              await tick();
              check('合成点击不授权领取（isTrusted 校验）',
                claims('hb:claim').length === 0, JSON.stringify(claims('hb:claim')));
            }

            if (lottery) {
              check('抽奖卡片显示倒计时',
                /秒$/.test(String((inCard('#lottery-countdown') || {}).textContent || '')),
                inCard('#lottery-countdown') && inCard('#lottery-countdown').textContent);
              check('抽奖卡片列出参与者',
                Boolean(inCard('#lottery-participants')) && inCard('#lottery-participants').textContent.includes('bob'));
              check('未报名时给出参与按钮',
                Boolean(inCard('#lottery-join')) && inCard('#lottery-join').hidden === false);
              if (inCard('#lottery-join')) click(inCard('#lottery-join'));
              await tick();
              check('合成点击不授权报名（isTrusted 校验）',
                claims('hb:claim').length === 0, JSON.stringify(claims('hb:claim')));
            }

            if (entryId === 'hp3') {
              check('已领取的历史红包直接展开结果视图',
                Boolean(inCard('#envelope-opened-view')) && inCard('#envelope-opened-view').style.display === 'flex');
              check('显示领取金额',
                String((inCard('#env-claimed-amount') || {}).textContent || '').startsWith('1.23'),
                inCard('#env-claimed-amount') && inCard('#env-claimed-amount').textContent);
              check('渲染领取记录',
                Boolean(inCard('#env-claims-list'))
                && inCard('#env-claims-list').querySelectorAll('.envelope-claim-row').length === 1);
              check('收起封口视图',
                Boolean(inCard('#envelope-closed-view')) && inCard('#envelope-closed-view').style.display === 'none');
              check('已经落定的条目不再给开启入口', !inCard('#btn-open-packet-detail'));
            }

            if (entryId === 'hp4') {
              // 原站 showEnvelopeResult('红包已被领取完', 0, …)：自己没领到也照样把 0.00 显示出来。
              check('没领到的已领完红包照样显示 0.00',
                Boolean(inCard('#env-claimed-amount')) && inCard('#env-claimed-amount').hidden === false
                && String(inCard('#env-claimed-amount').textContent).startsWith('0.00'),
                inCard('#env-claimed-amount') && (inCard('#env-claimed-amount').textContent + ' hidden=' + inCard('#env-claimed-amount').hidden));
              check('标题是原站的「红包已被领取完」',
                String((inCard('#env-opened-title') || {}).textContent || '') === '红包已被领取完',
                inCard('#env-opened-title') && inCard('#env-opened-title').textContent);
              // 原站 claimAvatarSrc 直接用站点返回的地址，卡片不再把它挡成占位图。
              const avatars = Array.from((card() || { querySelectorAll: () => [] }).querySelectorAll('.envelope-claim-user img'))
                .map((img) => img.getAttribute('src'));
              check('头像用站点返回的地址',
                avatars.length === 2 && avatars.every((src) => String(src).startsWith('https://cdn.ldstatic.com/')),
                JSON.stringify(avatars));
              check('领取记录保持原站的排序（手气王在前）',
                (card().querySelector('.envelope-claim-user span') || {}).textContent === 'Yueby');
              // 原站卡片上没有「×」：关窗口交给窗口自己，卡片里只有「确定」。
              check('卡面上没有原站没有的 × 按钮', !card().querySelector('.envelope-dismiss'));
            }

            // 关掉卡片就等于关窗口：宿主也不能留在 DOM 里（它是盖住整页的一层）。
            if (inCard('.envelope-close-btn')) click(inCard('.envelope-close-btn'));
            else globalThis.HBEnvelope.close();
            await tick();
            check('关掉卡片会关掉窗口', closeCalls === 1, String(closeCalls));
            check('关掉卡片后宿主不留在 DOM 里', host() === null);
            window.dispatchEvent(new Event('pagehide'));
            await tick();
            await tick();
            const bag = sessionBag['hb-card-window'];
            check('窗口关掉后清掉自己那一格会话记录',
              !bag || bag[viewKind] === undefined, JSON.stringify(sessionBag));
          }
        } catch (error) {
          failed.push('FAIL 抛出异常 → ' + String(error && error.stack || error));
        }

        document.getElementById('harness-result').textContent =
          'PASS ' + passed.length + ' / FAIL ' + failed.length + '\n' + passed.concat(failed).join('\n');
        document.title = failed.length ? 'HARNESS-FAIL' : 'HARNESS-PASS';
      })();
    </script>
  </body>
</html>
