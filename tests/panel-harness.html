<!doctype html>
<!-- 面板 DOM 接线自检页（开发期用，不随扩展发布）。

     用法：把本文件复制到扩展产物目录（与 manifest.json 同级，例如同步后的
     D:\Green Files\chrome plugins\red-envelope-panel\），再用 Chrome 打开；页面用最小
     chrome API 替身挂载 panel.js，跑完把结果写进 #harness-result，标题变为 HARNESS-PASS / HARNESS-FAIL。

     无头运行示例（Windows 版 Chrome for Testing；面板自己不画卡片，窗口给到 560×900 只是
     按常用尺寸渲染）：
       chrome.exe --headless=new --disable-gpu --virtual-time-budget=5000 \
         --window-size=560,900 \
         --user-data-dir="D:\Green Files\ChromeForTestingProfiles\panel-harness" \
         --dump-dom "file:///D:/Green%20Files/chrome%20plugins/red-envelope-panel/panel-harness.html"

     红包卡片自 v0.9.7 起在独立窗口里显示，它的 DOM 自检在 card-harness.html。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>panel harness</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="hb-popup">
    <main id="app"></main>
    <pre id="harness-result">running</pre>
    <script>
      // 最小 chrome API 替身：只回放面板用到的消息契约。
      const sent = [];
      const listeners = [];
      const sidePanelOpens = [];
      let closeCalls = 0;
      // 详情窗口的替身记录：面板开窗、拉前、收掉旧窗口的参数都记下来供断言。
      const cardWindows = [];
      const windowUpdates = [];
      const windowRemovals = [];
      const sessionBag = {};
      let nextWindowId = 100;
      window.close = () => { closeCalls += 1; };
      const state = {
        entries: [],
        removed: [],
        settings: { charset: 'text', batch: false, claimMode: 'manual', gapExtraMs: 0, display: 'panel' },
        paused: false,
        pausedReason: '',
      };
      // 后台真实行为是「写 storage → storage.onChanged → 所有面板重渲染」，替身照做一遍。
      const notify = () => listeners.forEach((listener) => listener({ 'hb-state-v1': { newValue: state } }, 'local'));
      // 详情卡片要的原始红包：替身按 id 回放，字段与站点返回的形状一致。
      const packetDetails = {
        hp1: {
          id: 'hp1', type: 'random', status: 'active', code: '11775521', wish: '恭喜发财，大吉大利',
          creator: { username: 'alice', linuxdo_id: 1 }, count: 5, claimed_count: 2, claimed_amount: 1.23,
          claims: [{ share_id: 7, username: 'carol', amount: 1.23, at: 2 }],
        },
        hp2: {
          id: 'hp2', type: 'lottery', status: 'active', distribution_type: 'random', code: '11775521',
          wish: '拼手气抽奖', creator: { username: 'alice', linuxdo_id: 1 }, total_amount: 20, count: 3,
          draw_at: Date.now() + 60000, server_now: Date.now(),
          participants: [{ username: 'bob', name: 'bob', linuxdo_id: 9 }], winners: [],
        },
        hp3: {
          id: 'hp3', type: 'random', status: 'exhausted', code: '11775521', wish: '恭喜发财，大吉大利',
          creator: { username: 'alice', linuxdo_id: 1 }, count: 5, claimed_count: 2, claimed_amount: 1.23,
          mine: 1.23, claims: [{ share_id: 7, username: 'carol', amount: 1.23, at: 2 }],
        },
      };
      globalThis.chrome = {
        runtime: {
          getManifest: () => ({ version: 'harness' }),
          getURL: (path) => 'chrome-extension://harness/' + path,
          sendMessage: async (message) => {
            sent.push(message);
            if (message.type === 'hb:state:get') return { ok: true, state };
            if (message.type === 'hb:state:patch') {
              Object.assign(state.settings, message.patch.settings || {});
              notify();
              return { ok: true, state };
            }
            if (message.type === 'hb:submit') {
              for (const item of message.codes || []) {
                state.entries.push({
                  id: 'harness-' + (state.entries.length + 1),
                  code: item.code,
                  charset: item.charset,
                  claimMode: message.claimMode,
                  status: 'queued',
                  result: '',
                  lines: null,
                  packetId: null,
                  matched: false,
                  packet: null,
                  createdAt: 1,
                  startedAt: null,
                  finishedAt: null,
                  scheduledAt: Date.now() + 5000,
                });
              }
              notify();
              return { ok: true, added: (message.codes || []).length, state };
            }
            if (message.type === 'hb:claim') {
              const row = state.entries.find((item) => item.id === message.id);
              return {
                ok: true,
                state,
                outcome: { lines: [{ text: '领取成功: +1.23 LDC', tone: 'success' }], amount: 1.23 },
                packet: packetDetails[row && row.packetId] || null,
              };
            }
            if (message.type === 'hb:packet') return { ok: true, packet: packetDetails[message.id] || null };
            if (message.type === 'hb:session') return { ok: true, loggedIn: true, username: 'harness', linuxdo_id: 9 };
            if (['hb:void', 'hb:delete', 'hb:void-all', 'hb:clear', 'hb:resume'].includes(message.type)) {
              if (message.type === 'hb:resume') {
                state.paused = false;
                state.pausedReason = '';
                notify();
              }
              return { ok: true, state };
            }
            return { ok: false, error: '未知消息：' + String(message.type) };
          },
        },
        storage: {
          onChanged: { addListener: (listener) => listeners.push(listener) },
          session: {
            get: async (key) => (key in sessionBag ? { [key]: sessionBag[key] } : {}),
            set: async (items) => { Object.assign(sessionBag, items); },
            remove: async (key) => { delete sessionBag[key]; },
          },
        },
        tabs: {
          create: () => {},
        },
        windows: {
          getCurrent: async () => ({ id: 1 }),
          // 面板开出去的详情窗口：这里只记参数并把窗口号登记进会话存储（真实浏览器里是窗口
          // 里的 card.js 自己登记——按卡片种类分格，见 card-window.js 的 remember）。照形状
          // 回放一遍，面板的「复用同一个窗口」逻辑才有据可依。
          create: async (props) => {
            const id = nextWindowId;
            nextWindowId += 1;
            cardWindows.push({ id, ...props });
            const url = new URL(props.url);
            const view = url.searchParams.get('view') === 'detail' ? 'detail' : 'claim';
            const bag = sessionBag['hb-card-window'] && typeof sessionBag['hb-card-window'] === 'object'
              ? sessionBag['hb-card-window'] : {};
            bag[view] = { windowId: id, entryId: url.searchParams.get('id') };
            sessionBag['hb-card-window'] = bag;
            return { id, tabs: [{ id: id * 10 }] };
          },
          get: async (id) => {
            const found = cardWindows.find((item) => item.id === id);
            if (!found) throw new Error('窗口已关闭');
            return { id, tabs: [{ id: id * 10 }] };
          },
          update: async (id, props) => { windowUpdates.push({ id, ...props }); return { id }; },
          // 关掉窗口：从替身里划掉，之后 windows.get 会失败（跟真的关掉了一样）。
          remove: async (id) => {
            windowRemovals.push(id);
            const index = cardWindows.findIndex((item) => item.id === id);
            if (index >= 0) cardWindows.splice(index, 1);
          },
        },
        sidePanel: { open: async (options) => { sidePanelOpens.push(options); } },
      };
    </script>
    <script src="browser-shim.js"></script>
    <script src="code-rules.js"></script>
    <script src="hb-protocol.js"></script>
    <script src="card-window.js"></script>
    <script src="panel.js"></script>
    <script>
      (async () => {
        const passed = [];
        const failed = [];
        const check = (name, ok, detail) => {
          (ok ? passed : failed).push((ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' → ' + detail : ''));
        };
        const tick = () => new Promise((resolve) => setTimeout(resolve, 0));
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        // 侧边栏被收起来时页面是真的 hidden，这里照着重放一次（visibilityState 只读，改在实例上）。
        const setVisibility = (value) => {
          Object.defineProperty(document, 'visibilityState', { value, configurable: true });
          document.dispatchEvent(new Event('visibilitychange'));
        };
        const touch = (node) => node.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
        const input = () => document.getElementById('hb-input');
        const textarea = () => document.getElementById('hb-textarea');
        const submit = () => document.getElementById('hb-submit');
        const counter = () => document.getElementById('hb-count');
        const sessionText = () => document.getElementById('hb-session-text');
        const config = () => document.getElementById('hb-config');
        const gap = () => document.getElementById('hb-gap');
        const row = (id) => document.querySelector('#hb-list .hb-entry[data-id="' + id + '"]');
        const rows = () => document.querySelectorAll('#hb-list .hb-entry');
        const click = (node) => node.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        const type = (field, value) => {
          field.value = value;
          field.dispatchEvent(new Event('input', { bubbles: true }));
        };
        const paste = (field, text) => {
          const event = new Event('paste', { bubbles: true, cancelable: true });
          Object.defineProperty(event, 'clipboardData', { value: { getData: () => text } });
          field.dispatchEvent(event);
        };
        const TICK = String.fromCharCode(96);
        const share = (code) => '我向你分享了一个LDC红包，打开 ' + TICK + 'hb.unsnow.org' + TICK
          + ' ，输入口令 ' + TICK + code + TICK + ' 领取';
        const openButton = (id) => (row(id) ? row(id).querySelector('button[data-action="open"]') : null);

        try {
          globalThis.HBPanel.mount(document.getElementById('app'), { shell: 'popup' });
          await tick();
          await tick();

          // 打开就把焦点放进输入框（弹出面板与常显侧边栏一样），省掉一次点击。
          check('打开面板焦点落在输入框', document.activeElement === input(),
            String(document.activeElement && (document.activeElement.id || document.activeElement.tagName)));
          // 侧边栏的交焦点比页面加载晚：Chrome 把面板挂上去之后才给焦点，还可能先落在面板里
          // 别的元素上，所以刚打开的那一两秒里会补几次（这里模拟「焦点先落在别处」）。
          document.getElementById('hb-open-site').focus();
          await wait(150);
          check('浏览器先给了别的元素焦点也补回输入框', document.activeElement === input(),
            String(document.activeElement && (document.activeElement.id || document.activeElement.tagName)));
          // 窗口晚一步拿到焦点（侧边栏就是这一跳）时再确认一次。
          document.activeElement.blur();
          window.dispatchEvent(new Event('focus'));
          check('窗口拿到焦点时把光标放进输入框', document.activeElement === input(),
            String(document.activeElement && (document.activeElement.id || document.activeElement.tagName)));

          // 面板里不该有脚本版侧边栏没有的常驻提示区（底部那行整个删掉了）。
          check('面板没有 #hb-hint 元素', document.getElementById('hb-hint') === null);
          check('面板没有 .hb-hint 提示行', document.querySelector('.hb-hint') === null);

          // 没有记录就空着（脚本版也一样），不写占位文案；面板只占内容那么高，
          // 空出来的高度让给口令历史，而不是在下面留一块空底。
          const listBox = document.getElementById('hb-list');
          check('空历史不渲染占位文案', listBox.children.length === 0, String(listBox.children.length));
          const panelHeight = Math.round(document.getElementById('app').getBoundingClientRect().height);
          check('空历史时面板只有内容高度', panelHeight < 300,
            panelHeight + 'px @ ' + window.innerWidth + '×' + window.innerHeight);

          // 输入区与草稿。
          check('面板渲染出输入框', Boolean(input()) && input().hidden === false);
          check('批量输入框初始隐藏', textarea().hidden === true);
          check('初始计数 0/18', counter().textContent === '0/18', counter().textContent);
          check('空草稿禁用提交', submit().disabled === true);
          type(input(), '  新年 快乐发财 ');
          check('输入即时清洗', input().value === '新年快乐发财', input().value);
          check('计数跟随草稿', counter().textContent === '6/18', counter().textContent);
          check('合法口令启用提交', submit().disabled === false);
          input().value = '';
          paste(input(), share('11775521'));
          check('粘贴分享文案只留口令', input().value === '11775521', input().value);

          // 头部两个开关。
          click(document.querySelector('[data-switch="charset"]'));
          await tick();
          check('切到数字模式', document.querySelector('[data-switch="charset"]').getAttribute('aria-checked') === 'true');
          check('数字模式占位提示', input().placeholder === '8 位数字（0–9）', input().placeholder);
          check('设置改动写入后台',
            sent.some((message) => message.type === 'hb:state:patch' && message.patch.settings.charset === 'numeric'));
          type(input(), '1177552199x');
          check('数字模式按 8 位截断', input().value === '11775521', input().value);
          click(document.querySelector('[data-switch="batch"]'));
          await tick();
          check('切到批量模式', textarea().hidden === false && input().hidden === true);
          check('草稿搬到批量输入框', textarea().value === '11775521', textarea().value);

          // 配置面板（脚本版里齿轮按钮展开的那块）。
          check('配置面板初始收起', config().hidden === true);
          click(document.getElementById('hb-config-toggle'));
          await tick();
          check('点齿轮展开配置面板', config().hidden === false
            && document.getElementById('hb-config-toggle').getAttribute('aria-expanded') === 'true');
          check('配置面板显示扩展版本号',
            document.getElementById('hb-config-version').textContent === 'vharness',
            document.getElementById('hb-config-version').textContent);
          check('领取方式默认古法',
            document.querySelector('[data-switch="claimMode"]').getAttribute('aria-checked') === 'false');
          click(document.querySelector('[data-switch="claimMode"]'));
          await tick();
          check('领取方式可切到协议', document.querySelector('[data-switch="claimMode"]').getAttribute('aria-checked') === 'true'
            && sent.some((message) => message.type === 'hb:state:patch' && message.patch.settings.claimMode === 'direct'));
          check('间隔时间显示基础 5000+',
            /5000\+/.test(config().textContent), config().textContent.slice(0, 40));
          check('间隔时间输入框回填当前加时', gap().value === '0', gap().value);
          type(gap(), '2500');
          await tick();
          check('间隔时间写入后台',
            sent.some((message) => message.type === 'hb:state:patch' && message.patch.settings.gapExtraMs === 2500));
          type(gap(), '99999');
          await tick();
          check('间隔时间按上限夹紧',
            sent.some((message) => message.type === 'hb:state:patch' && message.patch.settings.gapExtraMs === 60000));
          type(gap(), '0');
          await tick();
          check('显示方式默认悬浮',
            document.querySelector('[data-switch="display"]').getAttribute('aria-checked') === 'false');
          click(document.querySelector('[data-switch="display"]'));
          await tick();
          check('悬浮切停靠会打开侧边栏并收起面板',
            sidePanelOpens.length === 1 && closeCalls === 1
            && sent.some((message) => message.type === 'hb:state:patch' && message.patch.settings.display === 'sidebar'));
          // 「检查登录」的结果写在配置面板那一行里（面板底部不再有提示区）。
          check('登录状态初始为未确认', sessionText().textContent === '状态未确认', sessionText().textContent);
          click(document.getElementById('hb-session'));
          await tick();
          await tick();
          check('检查登录写进配置面板的那一行',
            sessionText().textContent === '已登录：harness', sessionText().textContent);

          // 队列与历史。
          check('作废队列在没有排队口令时禁用', document.getElementById('hb-void-all').disabled === true);
          paste(textarea(), share('11775521') + '\n' + share('87654321'));
          check('批量粘贴逐行取出口令', textarea().value === '11775521\n87654321', textarea().value);
          document.getElementById('hb-form').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
          await tick();
          await tick();
          const request = sent.find((message) => message.type === 'hb:submit');
          check('提交把两条口令交给后台', Boolean(request) && request.codes.length === 2,
            JSON.stringify(request && request.codes));
          check('提交成功后清空草稿', textarea().value === '', textarea().value);
          check('提交成功后按钮回到禁用', submit().disabled === true, String(submit().disabled));
          check('空草稿的按钮带「请先输入口令」说明', submit().title === '请先输入口令', submit().title);
          check('入队口令渲染成历史行', rows().length === 2, String(rows().length));
          check('历史头显示条数与排队数',
            /口令历史（2 条 · 排队 2 条）/.test(document.getElementById('hb-history-label').textContent),
            document.getElementById('hb-history-label').textContent);
          check('作废队列在有排队口令时可用', document.getElementById('hb-void-all').disabled === false);
          check('排队行给出作废按钮', document.querySelectorAll('#hb-list button[data-action="void"]').length === 2);
          check('排队行显示预计开始时间',
            /^预计 \d\d:\d\d:\d\d$/.test(document.querySelector('#hb-list .hb-entry-time').textContent),
            document.querySelector('#hb-list .hb-entry-time').textContent);
          check('排队行结果写「排队中」',
            document.querySelector('#hb-list .hb-entry-line').textContent === '排队中',
            document.querySelector('#hb-list .hb-entry-line').textContent);

          // 点口令填入输入框（脚本版历史行的核心交互）。
          click(row('harness-1').querySelector('.hb-entry-code'));
          check('批量模式下点口令追加一行', textarea().value === '11775521', textarea().value);
          click(row('harness-2').querySelector('.hb-entry-code'));
          check('批量模式下再点一条继续追加', textarea().value === '11775521\n87654321', textarea().value);
          click(document.querySelector('[data-switch="batch"]'));
          await tick();
          textarea().value = '';
          type(input(), 'x');
          click(row('harness-1').querySelector('.hb-entry-code'));
          check('单个模式下点口令替换草稿', input().value === '11775521', input().value);
          check('填入后计数跟着走', counter().textContent === '8/8', counter().textContent);
          input().value = '';

          // 普通红包：点「开红包」= 开一个独立的详情窗口（面板自己不再画卡片）。
          state.entries.push({
            id: 'awaiting-1',
            code: '11775521',
            charset: 'numeric',
            claimMode: 'manual',
            status: 'awaiting',
            result: '等待手动开启',
            lines: [{ text: '等待手动开启', tone: 'muted' }],
            packet: { id: 'hp1', type: 'random', status: 'active', code: '11775521', creator: { username: 'alice', linuxdo_id: 1 } },
            packetId: 'hp1',
            matched: true,
            createdAt: 2,
          });
          notify();
          await tick();
          await tick();
          const open = openButton('awaiting-1');
          check('待开启条目出现红包详情按钮', Boolean(open), open && open.className);
          check('待开启的时间列显示「待开启」',
            row('awaiting-1').querySelector('.hb-entry-time').textContent === '待开启',
            row('awaiting-1').querySelector('.hb-entry-time').textContent);
          if (open) click(open);
          await tick();
          await tick();
          const opened = cardWindows[0];
          check('点红包图标开出一个独立窗口', Boolean(opened) && cardWindows.length === 1, JSON.stringify(cardWindows));
          check('详情窗口指向 card.html 并带上红包 id 与只读视图',
            Boolean(opened) && opened.url === 'chrome-extension://harness/card.html?id=awaiting-1&view=detail',
            opened && opened.url);
          check('详情窗口是无标签栏的弹窗',
            Boolean(opened) && opened.type === 'popup' && opened.focused === true,
            opened && String(opened.type));
          check('开窗尺寸按普通红包卡片算（424×668 视口加外框估量）',
            Boolean(opened) && opened.width === 440 && opened.height === 708,
            opened && (opened.width + '×' + opened.height));
          check('面板自己不留卡片宿主', document.getElementById('hb-envelope-host') === null);
          // 同一个红包再点一次：把已有窗口拉到前面就行，不再开第二个。
          if (openButton('awaiting-1')) click(openButton('awaiting-1'));
          await tick();
          await tick();
          check('同一个红包只把窗口拉到前面，不重复开窗',
            cardWindows.length === 1
            && windowUpdates.some((item) => item.id === opened.id && item.focused === true),
            JSON.stringify(windowUpdates));

          // 换个红包：把开着的详情窗口关掉、按新卡片的尺寸重开一个，不留下第二个窗口。
          state.entries.push({
            id: 'done-1',
            code: '11775521',
            charset: 'numeric',
            claimMode: 'manual',
            status: 'done',
            result: '领取成功: +1.23 LDC',
            lines: [{ text: '领取成功: +1.23 LDC', tone: 'success' }],
            packet: { id: 'hp3', type: 'random', status: 'exhausted', code: '11775521', mine: 1.23, creator: { username: 'alice', linuxdo_id: 1 } },
            packetId: 'hp3',
            matched: true,
            createdAt: 3,
          });
          notify();
          await tick();
          if (openButton('done-1')) click(openButton('done-1'));
          await tick();
          await tick();
          check('换个红包时关掉旧窗口重开一个',
            windowRemovals.includes(opened.id)
            && cardWindows.length === 1
            && cardWindows[0].url === 'chrome-extension://harness/card.html?id=done-1&view=detail',
            JSON.stringify(cardWindows));
          check('换过之后仍然只有一个详情窗口', cardWindows.length === 1, String(cardWindows.length));
          check('已完结行只给删除动作',
            Boolean(row('done-1').querySelector('button[data-action="delete"]'))
            && !row('done-1').querySelector('button[data-action="void"]'));

          // 抽奖红包：先让详情窗口"被用户关掉"（替身里查不到这个窗口了），验证面板会重新开一个，
          // 且尺寸按抽奖卡算。卡片本身的渲染在 card-harness.html 里验。
          cardWindows.length = 0;
          const lotteryRow = {
            id: 'lottery-1',
            code: '11775521',
            charset: 'numeric',
            claimMode: 'manual',
            status: 'awaiting',
            result: '等待手动参与抽选',
            lines: [{ text: '等待手动参与抽选', tone: 'muted' }],
            packet: { id: 'hp2', type: 'lottery', joined: false, code: '11775521', creator: { username: 'alice', linuxdo_id: 1 } },
            packetId: 'hp2',
            matched: true,
            createdAt: 4,
          };
          state.entries.push(lotteryRow);
          notify();
          await tick();
          if (openButton('lottery-1')) click(openButton('lottery-1'));
          await tick();
          await tick();
          check('窗口关掉后再点开会重新开一个', cardWindows.length === 1, String(cardWindows.length));
          check('抽奖红包按抽奖卡开窗（544×812 视口加外框估量）',
            Boolean(cardWindows[0]) && cardWindows[0].width === 560 && cardWindows[0].height === 852,
            cardWindows[0] && (cardWindows[0].width + '×' + cardWindows[0].height));

          lotteryRow.packet = { id: 'hp2', type: 'lottery', joined: true, code: '11775521', creator: { username: 'alice', linuxdo_id: 1 } };
          lotteryRow.lines = [{ text: '已参与抽选，等待开奖', tone: 'success' }];
          packetDetails.hp2 = Object.assign({}, packetDetails.hp2, { joined: true });
          notify();
          await tick();
          check('已报名的抽奖行结果写等待开奖',
            row('lottery-1').querySelector('.hb-entry-line').textContent === '已参与抽选，等待开奖',
            row('lottery-1').querySelector('.hb-entry-line').textContent);
          if (row('lottery-1').querySelector('button[data-action="open"]')) {
            click(row('lottery-1').querySelector('button[data-action="open"]'));
          }
          await tick();
          await tick();
          check('已报名的抽奖行再点开只是把同一个窗口拉到前面',
            cardWindows.length === 1
            && windowUpdates.some((item) => item.id === cardWindows[0].id && item.focused === true),
            JSON.stringify(windowUpdates));
          check('报名之后行上不再给写入动作',
            document.querySelectorAll('#hb-list button[data-action="claim"]').length === 0);

          // 暂停横幅：文案来自后台，恢复按钮留在横幅里。
          state.paused = true;
          state.pausedReason = '领取失败: 已领取';
          notify();
          await tick();
          const banner = document.getElementById('hb-paused');
          check('暂停横幅显示原因', banner.hidden === false
            && document.getElementById('hb-paused-text').textContent === '执行已暂停：领取失败: 已领取',
            document.getElementById('hb-paused-text').textContent);
          check('排队行在暂停时改显示「待执行」',
            row('harness-2').querySelector('.hb-entry-time').textContent === '待执行',
            row('harness-2').querySelector('.hb-entry-time').textContent);
          click(document.getElementById('hb-resume'));
          await tick();
          check('点恢复执行发 hb:resume', sent.some((message) => message.type === 'hb:resume'));

          click(document.querySelector('[data-switch="charset"]'));
          await tick();
          check('数字模式可切回文本', document.querySelector('[data-switch="charset"]').getAttribute('aria-checked') === 'false');
          type(input(), 'abc12');
          check('短口令禁用提交', submit().disabled === true && /不足 6 个字符/.test(submit().title), submit().title);

          // 焦点：用户点进去编辑别的控件（这里是间隔时间）之后就不再插手——焦点是他选的。
          touch(gap());
          gap().focus();
          window.dispatchEvent(new Event('focus'));
          check('用户动过之后不再抢焦点', document.activeElement === gap(),
            String(document.activeElement && document.activeElement.id));
          // 侧边栏被收起来再露出来＝又被打开了一次：清掉上面的记录，把光标放回输入框。
          document.activeElement.blur();
          setVisibility('hidden');
          setVisibility('visible');
          check('侧边栏再露出来时把焦点补回输入框', document.activeElement === input(),
            String(document.activeElement && document.activeElement.id));
          document.activeElement.blur();
          // 批量模式下的输入框是文本域，焦点跟着模式走。
          click(document.querySelector('[data-switch="batch"]'));
          await tick();
          check('批量模式下焦点落在批量输入框', document.activeElement === textarea(),
            String(document.activeElement && document.activeElement.id));
        } catch (error) {
          failed.push('FAIL 抛出异常 → ' + String(error && error.stack || error));
        }

        document.getElementById('harness-result').textContent =
          'PASS ' + passed.length + ' / FAIL ' + failed.length + '\n' + passed.concat(failed).join('\n');
        document.title = failed.length ? 'HARNESS-FAIL' : 'HARNESS-PASS';
      })();
    </script>
  </body>
</html>
